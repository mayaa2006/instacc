[project]
name = "instacc"
version = "0.1.0"
description = "Semi-autonomous content agent with a multi-model deliberation engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-telegram-bot>=21.0",
  "qrcode>=7.4",
]

[project.optional-dependencies]
download = ["huggingface_hub>=0.24"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
instacc = "agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
